# ══════════════════════════════════════════════════════
# PLAY 1 — All nodes: install & configure
# ══════════════════════════════════════════════════════
- hosts: all
  become: true
  vars:
    k8s_version: "v1.34"   # ← change to your desired version
    k8s_gpg_path: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    apt_cache_valid_time: 3600

  handlers:
    - name: restart containerd
      ansible.builtin.service:
        name: containerd
        state: restarted
        enabled: yes

  tasks:
    # ── Cleanup old/broken repo entries first ───────────────────────────────────
    - name: Remove old Kubernetes apt repository file
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/kubernetes.list
        state: absent

    - name: Remove any legacy Kubernetes repo entries from sources.list
      ansible.builtin.lineinfile:
        path: /etc/apt/sources.list
        regexp: ".*kubernetes.*"
        state: absent

    - name: Remove old Kubernetes GPG key (legacy apt-key)
      ansible.builtin.apt_key:
        url: "https://packages.cloud.google.com/apt/doc/apt-key.gpg"
        state: absent
      ignore_errors: yes

    - name: Remove old GPG keyring file if exists
      ansible.builtin.file:
        path: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        state: absent

    - name: Clean apt cache
      ansible.builtin.command: apt-get clean
      changed_when: false

    - name: Update apt cache after cleanup
      ansible.builtin.apt:
        update_cache: yes

# ── Now install prerequisites ────────────────────────────────────────────────#

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: "{{ apt_cache_valid_time }}"

    - name: Install prerequisite packages
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
        state: present

    # ── New GPG key method ──────────
    - name: Create keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Kubernetes GPG key
      ansible.builtin.shell:
        cmd: >
          curl -fsSL https://pkgs.k8s.io/core:/stable:/{{ k8s_version }}/deb/Release.key
          | gpg --dearmor -o {{ k8s_gpg_path }}
        creates: "{{ k8s_gpg_path }}"

    # ── New versioned repo format ─────────────────────────────────────────────
    - name: Add Kubernetes apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by={{ k8s_gpg_path }}] https://pkgs.k8s.io/core:/stable:/{{ k8s_version }}/deb/ /"
        state: present
        filename: kubernetes
        update_cache: yes

    - name: Install containerd, kubelet, kubeadm and kubectl
      ansible.builtin.apt:
        name:
          - containerd
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: yes
      notify: restart containerd

    # ── Hold kube packages to prevent automatic upgrades ────────────────────────
    - name: Hold kube packages to prevent automatic upgrades
      ansible.builtin.command: apt-mark hold kubelet kubeadm kubectl
      changed_when: false
      check_mode: no

    # ── Load required kernel modules ───────────────────────────────────────────
    - name: Load required kernel modules
      ansible.builtin.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - br_netfilter
        - overlay

    # ── Make kernel modules persistent ───────────────────────────────────────────
    - name: Make kernel modules persistent
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          br_netfilter
          overlay

    # ── Set required sysctl params ───────────────────────────────────────────
    - name: Set required sysctl params
      ansible.builtin.copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1

    # ── Apply sysctl params ───────────────────────────────────────────
    - name: Apply sysctl params
      ansible.builtin.command: sysctl --system
      changed_when: false

      
# ══════════════════════════════════════════════════════
# PLAY 2 — Master only: kubeadm init + kubeconfig
# ══════════════════════════════════════════════════════
- hosts: master
  become: true
  vars:
    pod_network_cidr: "10.244.0.0/16"
    flannel_url: "https://raw.githubusercontent.com/flannel-io/flannel/master/Documentation/kube-flannel.yml"
    apt_cache_valid_time: 3600

  tasks:
    # ── Check if cluster already initialized ────────────────────────────────
    - name: Check if kubeadm already initialized
      
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: kubeadm_init_check

    - name: Print message if already initialized
      ansible.builtin.debug:
        msg: "Kubeadm already initialized, skipping initialization tasks."
      when: kubeadm_init_check.stat.exists

    # ── kubeadm init ────────────────────────────────────────────────────────
    - name: Initialize Kubernetes cluster
      ansible.builtin.command: >
        kubeadm init
        --pod-network-cidr={{ pod_network_cidr }}
      when: not kubeadm_init_check.stat.exists
      register: kubeadm_init_output

    - name: Print kubeadm init output
      ansible.builtin.debug:
        var: kubeadm_init_output.stdout_lines
      when: not kubeadm_init_check.stat.exists

    # ── Setup kubeconfig for current user ───────────────────────────────────
    - name: Create .kube directory
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/.kube"
        state: directory
        mode: "0755"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"



    - name: Copy admin.conf to user kubeconfig
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: "/home/{{ ansible_user }}/.kube/config"
        remote_src: yes
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"

    - name: Set KUBECONFIG in user bashrc
      ansible.builtin.lineinfile:
        path: "/home/{{ ansible_user }}/.bashrc"
        line: "export KUBECONFIG=/home/{{ ansible_user }}/.kube/config"
        state: present

    # ── Install Flannel CNI ───────────────────────────────────────────────────
    - name: Apply Flannel network plugin
      ansible.builtin.command: kubectl apply -f {{ flannel_url }}
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      when: not kubeadm_init_check.stat.exists
      changed_when: true



# ══════════════════════════════════════════════════════
# PLAY 3 — Workers: join the cluster
# ══════════════════════════════════════════════════════
- hosts: master
  become: true
  tasks:
    - name: Get join command from master
      ansible.builtin.command: kubeadm token create --print-join-command
      register: join_command
      changed_when: false

    - name: Save join command
      ansible.builtin.set_fact:
        kubeadm_join_command: "{{ join_command.stdout }}"

- hosts: worker
  become: true
  tasks:
    - name: Check if node already joined
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf_check

    - name: Join worker nodes to cluster
      ansible.builtin.command: "{{ hostvars[groups['master'][0]]['kubeadm_join_command'] }}"
      when: not kubelet_conf_check.stat.exists
      changed_when: true


